name: Deploy to GitHub Pages

# Builds and publishes the editor to GitHub Pages via the modern Actions
# pipeline (actions/deploy-pages) instead of the legacy branch builder, which
# was slow (~3 min) and occasionally failed with "try again later". Fully
# automatic on every push to develop — no local build + gh-pages push needed.

on:
  push:
    branches: [develop]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/brickwright/microbit
          key: microbit-firmware-${{ hashFiles('scripts/prepublish.mjs') }}

      # --ignore-scripts avoids running network downloads implicitly during install.
      - name: Install
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      # Keep production SB3 serialization consistent with the source editor.
      - name: Apply Brickwright scratch-vm patch
        run: npx patch-package --error-on-fail

      - name: Fetch and verify micro:bit firmware URL
        run: npm run prepublish

      - name: Build
        env:
          CI: "true"
          NODE_ENV: production
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npx webpack --bail

      - name: Add .nojekyll
        run: touch build/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
